<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SunTech AutoQuote — QuickBooks</title>
<style>
  :root {
    --accent: #f2a400;
    --accent-fonce: #cc8500;
    --texte: #1f2430;
    --texte-doux: #4a5062;
    --fond: #faf9f7;
    --carte: #ffffff;
    --trait: #e7e3da;
    --vert: #1f7a4d;
    --vert-fond: #e9f6ef;
    --rouge: #8a1f1f;
    --rouge-fond: #fdecec;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--fond);
    color: var(--texte);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6;
  }
  .entete { border-bottom: 1px solid var(--trait); background: var(--carte); }
  .entete-interieur {
    max-width: 820px; margin: 0 auto; padding: 24px 20px;
    display: flex; align-items: center; gap: 14px;
  }
  .entete img { height: 38px; width: auto; }
  .entete strong { font-size: 15px; letter-spacing: .01em; }
  main { max-width: 560px; margin: 0 auto; padding: 48px 20px 64px; text-align: center; }
  .pastille {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 54px; height: 54px;
    border-radius: 50%;
    margin: 0 auto 18px;
    font-size: 26px;
  }
  .pastille.ok { background: var(--vert-fond); color: var(--vert); }
  .pastille.erreur { background: var(--rouge-fond); color: var(--rouge); }
  h1 { font-size: 22px; margin: 0 0 10px; }
  p { color: var(--texte-doux); margin: 0 0 24px; }
  .bouton {
    display: inline-block;
    background: var(--accent);
    color: #241a00;
    font-weight: 700;
    text-decoration: none;
    padding: 12px 26px;
    border-radius: 8px;
    font-size: 15px;
  }
  .bouton:hover { background: var(--accent-fonce); color: #fff; }
  .note {
    margin-top: 28px;
    padding: 14px 16px;
    background: var(--carte);
    border: 1px solid var(--trait);
    border-radius: 10px;
    font-size: 13.5px;
    color: var(--texte-doux);
  }
</style>
</head>
<body>
  <div class="entete">
    <div class="entete-interieur">
      <img src="assets/logosuntech.png" alt="SunTech Énergie">
      <strong>SunTech Énergie</strong>
    </div>
  </div>
  <main>
    <div class="pastille ok" id="pastille" aria-hidden="true">✓</div>
    <h1 id="titre">Connexion à QuickBooks réussie</h1>
    <p id="texte">SunTech AutoQuote est maintenant connecté à votre dossier QuickBooks Online. Vous pouvez retourner à l'application sur votre poste.</p>
    <a class="bouton" href="connexion.html" id="bouton-secours" hidden>Réessayer la connexion</a>
    <div class="note">
      Vous pouvez fermer cet onglet. Cette page ne recharge aucune donnée automatiquement.
    </div>
  </main>
  <script>
    const params = new URLSearchParams(window.location.search);
    const etat = params.get("etat");
    const message = params.get("message");

    if (etat === "erreur") {
      document.getElementById("pastille").className = "pastille erreur";
      document.getElementById("pastille").textContent = "!";
      document.getElementById("titre").textContent = "La connexion à QuickBooks a échoué";
      document.getElementById("texte").textContent =
        message || "Une erreur est survenue pendant la connexion. Retournez à l'application et réessayez.";
      document.getElementById("bouton-secours").hidden = false;
    }
  </script>
</body>
</html>
