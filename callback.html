<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connexion en cours — SunTech AutoQuote</title>
<style>
  :root {
    --accent: #f2a400;
    --accent-fonce: #cc8500;
    --texte: #1f2430;
    --texte-doux: #4a5062;
    --fond: #faf9f7;
    --carte: #ffffff;
    --trait: #e7e3da;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--fond);
    color: var(--texte);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6;
  }
  .entete { border-bottom: 1px solid var(--trait); background: var(--carte); }
  .entete-interieur {
    max-width: 820px; margin: 0 auto; padding: 24px 20px;
    display: flex; align-items: center; gap: 14px;
  }
  .entete img { height: 38px; width: auto; }
  .entete strong { font-size: 15px; letter-spacing: .01em; }
  main { max-width: 560px; margin: 0 auto; padding: 48px 20px 64px; text-align: center; }
  h1 { font-size: 20px; margin: 0 0 10px; }
  p { color: var(--texte-doux); margin: 0 0 24px; }
  .spin {
    width: 34px; height: 34px; margin: 0 auto 20px;
    border: 3px solid var(--trait);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: tourner 0.8s linear infinite;
  }
  @keyframes tourner { to { transform: rotate(360deg); } }
  .bouton {
    display: inline-block;
    background: var(--accent);
    color: #241a00;
    font-weight: 700;
    text-decoration: none;
    padding: 12px 26px;
    border-radius: 8px;
    font-size: 15px;
  }
  .bouton:hover { background: var(--accent-fonce); color: #fff; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div class="entete">
    <div class="entete-interieur">
      <img src="assets/logosuntech.png" alt="SunTech Énergie">
      <strong>SunTech Énergie</strong>
    </div>
  </div>
  <main>
    <div class="spin" aria-hidden="true"></div>
    <h1 id="titre">Finalisation de la connexion…</h1>
    <p id="texte">Redirection vers l'application SunTech AutoQuote sur votre poste.</p>
    <a class="bouton" id="lien-manuel" href="#" hidden>Continuer vers l'application</a>
  </main>
  <script>
    // Port cohérent avec le serveur local de SunTech AutoQuote.
    const LOCAL = "http://localhost:8000";

    // Relaie tel quel tout le query string reçu d'Intuit (code, state,
    // realmId, ou error / error_description en cas de refus) vers le
    // serveur local, qui valide le paramètre state et gère les erreurs.
    const cible = LOCAL + "/callback" + window.location.search;

    const lien = document.getElementById("lien-manuel");
    lien.href = cible;

    if (!window.location.search) {
      document.getElementById("titre").textContent = "Paramètres de connexion manquants";
      document.getElementById("texte").textContent =
        "Cette page doit être atteinte uniquement depuis le portail de connexion QuickBooks.";
      lien.hidden = false;
      lien.textContent = "Retourner à la connexion";
      lien.href = "connexion.html";
    } else {
      window.location.replace(cible);
      // Si la redirection automatique est bloquée par le navigateur,
      // affiche un lien manuel après un court délai.
      setTimeout(function () { lien.hidden = false; }, 2500);
    }
  </script>
</body>
</html>
